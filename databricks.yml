# Declarative Automation Bundle: the whole Axfood demo as code (replaces image + SageMaker job + Airflow DAG).
bundle:
  name: axfood_demo

variables:
  catalog:
    description: Unity Catalog catalog (CREATE CATALOG is blocked on this shared metastore, so we reuse an existing one)
    default: agentbricks_demo_catalog
  schema:
    description: Schema that holds all demo tables, features and the model
    default: axfood_demo

include:
  - resources/*.yml

targets:
  # fevm-agentbricks-demo: used by scripts/setup.sh (databricks bundle deploy -t dev)
  dev:
    mode: development
    workspace:
      host: https://fevm-agentbricks-demo.cloud.databricks.com
  # Git demo: the default target, e2-demo-field-eng (databricks bundle deploy)
  e2:
    default: true
    mode: development
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
    variables:
      catalog: main
